<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>JAGESH ELECTRONIC</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,system-ui,sans-serif;
 background:#f3f4f6;color:#111827
}
header{
 background:#111827;color:white;padding:12px 15px;
 display:flex;align-items:center;gap:10px;
 position:sticky;top:0;z-index:10
}
header img{width:46px;height:46px;object-fit:contain;border-radius:10px;background:white}
header h1{font-size:17px;margin:0}
header small{opacity:.75}
main{max-width:900px;margin:auto;padding:15px}
button,input,select,textarea{font:inherit}
button{
 border:0;border-radius:10px;padding:11px 14px;
 cursor:pointer
}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}

.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.card{
 background:white;border:1px solid #e5e7eb;
 border-radius:16px;padding:15px;
 text-align:left;box-shadow:0 3px 12px #0000000d
}
.card:active{transform:scale(.98)}
.num{font-size:28px;font-weight:bold}
.muted{font-size:13px;color:#6b7280}

.actions{
 display:flex;flex-wrap:wrap;gap:8px;margin:12px 0
}
.panel,.customer{
 background:white;border-radius:16px;padding:15px;
 border:1px solid #e5e7eb;margin-top:12px
}
label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}
input,select,textarea{
 width:100%;padding:11px;border:1px solid #d1d5db;
 border-radius:9px;background:white
}
textarea{min-height:75px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}

.modal{
 position:fixed;inset:0;background:#0008;z-index:50;
 display:flex;align-items:flex-end;justify-content:center
}
.sheet{
 width:min(900px,100%);max-height:94vh;overflow:auto;
 background:white;border-radius:20px 20px 0 0;padding:18px
}

#lock{
 position:fixed;inset:0;background:#111827;color:white;
 z-index:9999;display:flex;align-items:center;justify-content:center;
 padding:20px
}
.pinbox{
 width:min(380px,100%);background:#1f2937;
 border-radius:22px;padding:25px;text-align:center
}
.pinbox img{width:75px;height:75px;background:white;border-radius:16px;object-fit:contain}
.dots{display:flex;justify-content:center;gap:8px;margin:18px}
.dot{width:12px;height:12px;border:1px solid white;border-radius:50%}
.dot.on{background:white}
.pad{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;max-width:280px;margin:auto
}
.key{background:#374151;color:white;font-size:20px;padding:15px}
.error{color:#fca5a5;min-height:20px}

@media(min-width:700px){
 .grid{grid-template-columns:repeat(4,1fr)}
 .modal{align-items:center}
 .sheet{border-radius:20px}
}
</style>
</head>

<body>

<!-- LOGIN PIN -->
<div id="lock">
<div class="pinbox">
<img src="logo.jpg" onerror="this.style.display='none'">
<h2>JAGESH ELECTRONIC</h2>
<div id="pinText">6 Digit PIN डालें</div>
<div class="dots" id="dots"></div>
<div class="pad" id="pad"></div>
<div class="error" id="pinError"></div>
<button id="resetPin" class="secondary hidden">PIN Reset</button>
</div>
</div>

<header>
<img src="logo.jpg" onerror="this.style.display='none'">
<div>
<h1>JAGESH ELECTRONIC</h1>
<small>Customer Reminder</small>
</div>
<button class="secondary" style="margin-left:auto" onclick="lockApp()">🔒</button>
</header>

<main>

<!-- DASHBOARD -->
<section>
<div class="grid">

<button class="card" onclick="showCustomers('all')">
<div class="num" id="total">0</div>
<div class="muted">👥 कुल Customers<br><b>Tap करें</b></div>
</button>

<button class="card" onclick="showCustomers('today')">
<div class="num" id="today">0</div>
<div class="muted">🔔 आज के Reminder<br><b>Tap करें</b></div>
</button>

<button class="card" onclick="showCustomers('upcoming')">
<div class="num" id="upcoming">0</div>
<div class="muted">⏰ Upcoming<br><b>Tap करें</b></div>
</button>

<button class="card" onclick="showCustomers('overdue')">
<div class="num" id="overdue">0</div>
<div class="muted">⚠️ Overdue<br><b>Tap करें</b></div>
</button>

</div>

<div class="actions">
<button class="primary" onclick="addCustomer()">＋ Customer</button>
<button class="secondary" onclick="historyPage()">📋 History</button>
<button class="secondary" onclick="recycleBin()">🗑️ Recycle Bin</button>
<button class="secondary" onclick="backup()">💾 Backup</button>
<button class="secondary" onclick="document.getElementById('restore').click()">↩️ Restore</button>
<input id="restore" type="file" accept=".json" hidden onchange="restoreBackup(event)">
</div>
</section>

<section id="list" class="panel hidden">
<input id="search" placeholder="Customer search..." oninput="renderList()">
<div id="customers"></div>
</section>

</main>

<!-- FORM -->
<div id="modal" class="modal hidden">
<div class="sheet">

<div class="actions" style="justify-content:space-between">
<h2 id="title">Customer</h2>
<button class="secondary" onclick="closeModal()">✕</button>
</div>

<div id="form"></div>

</div>
</div>

<script>

const KEY="JAGESH_CUSTOMERS_V5";
const TRASH="JAGESH_TRASH_V5";
const PIN="JAGESH_APP_PIN_V5";
const BINPIN="JAGESH_BIN_PIN_V5";

let customers=JSON.parse(localStorage.getItem(KEY)||"[]");
let trash=JSON.parse(localStorage.getItem(TRASH)||"[]");
let editing=null;
let pin="";
let pinMode="login";

const $=x=>document.getElementById(x);

function saveData(){
 localStorage.setItem(KEY,JSON.stringify(customers));
 localStorage.setItem(TRASH,JSON.stringify(trash));
 dashboard();
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function addMonths(date,n){
 let d=new Date(date+"T12:00:00");
 d.setMonth(d.getMonth()+Number(n));
 return d.toISOString().slice(0,10);
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,
 m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* DASHBOARD */

function dashboard(){

 let t=today();

 $("total").textContent=customers.length;

 $("today").textContent=
 customers.filter(x=>x.reminder===t).length;

 $("upcoming").textContent=
 customers.filter(x=>x.reminder>t).length;

 $("overdue").textContent=
 customers.filter(x=>x.reminder<t).length;
}

/* APPLIANCE WORK TYPES */

const workTypes={
 "AC":[
  "Service",
  "Repair",
  "Installation",
  "Uninstallation",
  "Gas Charging",
  "Other"
 ],
 "LED TV":[
  "Repair",
  "Installation",
  "Uninstallation",
  "Board/Panel Work",
  "Other"
 ],
 "Refrigerator":[
  "Repair",
  "Installation",
  "Uninstallation",
  "Gas Charging",
  "Compressor Work",
  "Other"
 ],
 "Microwave":[
  "Repair",
  "Installation",
  "Uninstallation",
  "Parts/Component Work",
  "Other"
 ],
 "Washing Machine":[
  "Service",
  "Repair",
  "Installation",
  "Uninstallation",
  "Parts Work",
  "Other"
 ]
};

function workOptions(selected=""){

 let appliance=$("appliance").value;
 let arr=workTypes[appliance]||["Repair","Installation","Other"];

 $("work").innerHTML=arr.map(x=>
 `<option ${x===selected?"selected":""}>${x}</option>`
 ).join("");
}

/* ADD CUSTOMER */

function addCustomer(){

 editing=null;

 showForm({
  name:"",
  phone:"",
  appliance:"AC",
  work:"Service",
  description:"",
  workDate:today(),
  reminderType:"3",
  reminder:"",
  payment:"",
  method:"Cash",
  lat:"",
  lng:"",
  notes:""
 });
}

/* FORM */

function showForm(x){

 $("title").textContent=editing?"Edit Customer":"Add Customer";

 $("form").innerHTML=`

<label>Customer Name</label>
<input id="name" value="${esc(x.name)}">

<label>Mobile Number</label>
<input id="phone" inputmode="tel" value="${esc(x.phone)}">

<div class="row">

<div>
<label>Appliance</label>
<select id="appliance" onchange="workOptions()">
<option>AC</option>
<option>LED TV</option>
<option>Refrigerator</option>
<option>Microwave</option>
<option>Washing Machine</option>
</select>
</div>

<div>
<label>क्या काम हुआ?</label>
<select id="work"></select>
</div>

</div>

<label>Work Description</label>
<input id="description"
placeholder="उदा. Main Board Repair"
value="${esc(x.description)}">

<div class="row">

<div>
<label>Work Date</label>
<input id="workDate" type="date" value="${esc(x.workDate)}">
</div>

<div>
<label>Reminder</label>
<select id="reminderType" onchange="reminderChanged()">
<option value="1">1 Month</option>
<option value="2">2 Months</option>
<option value="3">3 Months</option>
<option value="6">6 Months</option>
<option value="9">9 Months</option>
<option value="12">12 Months</option>
<option value="custom">Custom Date</option>
</select>
</div>

</div>

<div id="customDateBox" class="hidden">

<label>📅 Custom Reminder Date</label>

<input id="customDate"
type="date"
min="${today()}"
value="${esc(x.reminder||"")}">

</div>

<div class="row">

<div>
<label>💰 Payment Amount</label>
<input id="payment" inputmode="decimal"
value="${esc(x.payment)}">
</div>

<div>
<label>💳 Payment Method</label>
<select id="method">
<option>Cash</option>
<option>UPI</option>
<option>Other</option>
</select>
</div>

</div>

<label>📍 Customer Location</label>

<div class="actions">
<button type="button" class="secondary" onclick="getLocation()">
📍 Current Location
</button>
<span id="locationStatus" class="muted"></span>
</div>

<div class="row">
<input id="lat" readonly placeholder="Latitude"
value="${esc(x.lat)}">
<input id="lng" readonly placeholder="Longitude"
value="${esc(x.lng)}">
</div>

<label>Notes</label>
<textarea id="notes">${esc(x.notes)}</textarea>

<div class="actions">
<button class="primary" onclick="saveCustomer()">💾 Save Customer</button>
<button class="secondary" onclick="closeModal()">Cancel</button>
</div>
`;

 $("appliance").value=x.appliance||"AC";
 $("reminderType").value=x.reminderType||"3";
 $("method").value=x.method||"Cash";

 workOptions(x.work||"Service");
 reminderChanged();

 $("modal").classList.remove("hidden");
}

function reminderChanged(){

 let type=$("reminderType").value;

 $("customDateBox")
 .classList.toggle("hidden",type!=="custom");

}

/* SAVE */

function saveCustomer(){

 let name=$("name").value.trim();

 if(!name){
  alert("Customer Name डालें");
  return;
 }

 let type=$("reminderType").value;
 let date=$("workDate").value;
 let reminder;

 if(type==="custom"){

  reminder=$("customDate").value;

  if(!reminder){
   alert("Custom Reminder की तारीख चुनें");
   $("customDate").focus();
   return;
  }

 }else{
  reminder=addMonths(date,type);
 }

 let old=editing?
 customers.find(x=>x.id===editing):null;

 let record={
  id:editing||crypto.randomUUID(),
  name,
  phone:$("phone").value,
  appliance:$("appliance").value,
  work:$("work").value,
  description:$("description").value,
  workDate:date,
  reminderType:type,
  reminder,
  payment:$("payment").value,
  method:$("method").value,
  lat:$("lat").value,
  lng:$("lng").value,
  notes:$("notes").value,
  history:old?.history||[]
 };

 /* HISTORY */

 if(old){

  record.history.push({
   date:old.workDate,
   appliance:old.appliance,
   work:old.work,
   description:old.description,
   payment:old.payment,
   method:old.method,
   notes:old.notes
  });

 }

 let index=customers.findIndex(x=>x.id===record.id);

 if(index>=0)
  customers[index]=record;
 else
  customers.push(record);

 saveData();

 closeModal();

 showCustomers("all");
}

/* LOCATION */

function getLocation(){

 if(!navigator.geolocation){
  alert("इस browser में GPS उपलब्ध नहीं है");
  return;
 }

 $("locationStatus").textContent="Location मिल रही है...";

 navigator.geolocation.getCurrentPosition(

 p=>{

  $("lat").value=p.coords.latitude;
  $("lng").value=p.coords.longitude;

  $("locationStatus").textContent="✅ Location Saved";

 },

 e=>{
  $("locationStatus").textContent="";
  alert("Location नहीं मिल सकी: "+e.message);
 },

 {
  enableHighAccuracy:true,
  timeout:15000
 }

 );
}

/* CUSTOMER LIST */

let currentFilter="all";

function showCustomers(filter){

 currentFilter=filter;

 $("list").classList.remove("hidden");

 $("search").value="";

 renderList();

 $("list").scrollIntoView({behavior:"smooth"});
}

function renderList(){

 let q=$("search").value.toLowerCase();
 let t=today();

 let arr=customers.filter(x=>{

  let filterOK=

   currentFilter==="all" ||

   currentFilter==="today" &&
   x.reminder===t ||

   currentFilter==="upcoming" &&
   x.reminder>t ||

   currentFilter==="overdue" &&
   x.reminder<t;

  let searchOK=
   !q ||
   (x.name+" "+x.phone+" "+x.appliance+" "+x.work)
   .toLowerCase().includes(q);

  return filterOK&&searchOK;

 });

 $("customers").innerHTML=

 arr.length?

 arr.map(customerCard).join(""):

 `<p class="muted">कोई customer नहीं मिला।</p>`;
}

function customerCard(x){

 return `

<div class="customer">

<h3>${esc(x.name)}</h3>

<div>📱 ${esc(x.phone)}</div>

<div>
${esc(x.appliance)}
→
<b>${esc(x.work)}</b>
</div>

<div class="muted">
📅 Work: ${esc(x.workDate)}
<br>
🔔 Reminder: ${esc(x.reminder)}
<br>
💰 ₹${esc(x.payment||0)} (${esc(x.method||"")})
</div>

${x.description?
`<div>📝 ${esc(x.description)}</div>`:""}

<div class="actions">

<button class="primary"
onclick="callCustomer('${esc(x.phone)}')">
📞 Call
</button>

<button class="secondary"
onclick="whatsapp('${esc(x.phone)}','${encodeURIComponent(reminderMessage(x))}')">
💬 WhatsApp
</button>

<button class="secondary"
onclick="navigate('${x.lat}','${x.lng}')">
🗺️ Navigate
</button>

<button class="secondary"
onclick="editCustomer('${x.id}')">
✏️ Edit
</button>

<button class="danger"
onclick="deleteCustomer('${x.id}')">
🗑️ Delete
</button>

</div>

</div>

`;

}

/* MESSAGE */

function reminderMessage(x){

 return `नमस्ते ${x.name} जी 🙏

JAGESH ELECTRONIC की ओर से Reminder है।

Appliance: ${x.appliance}
Work: ${x.work}

आपके पिछले काम की तारीख: ${x.workDate}

Reminder Date: ${x.reminder}

किसी भी आवश्यकता के लिए संपर्क करें।

धन्यवाद 🙏
JAGESH ELECTRONIC`;

}

/* CALL / WHATSAPP / MAP */

function callCustomer(phone){

 location.href="tel:"+phone;

}

function whatsapp(phone,msg){

 location.href=
 "https://wa.me/91"+
 phone.replace(/\D/g,"")+
 "?text="+msg;

}

function navigate(lat,lng){

 if(!lat||!lng){

  alert("इस customer की location saved नहीं है।");

  return;
 }

 location.href=
 "https://www.google.com/maps/dir/?api=1&destination="+
 lat+","+lng;

}

/* EDIT */

function editCustomer(id){

 let x=customers.find(c=>c.id===id);

 if(!x)return;

 editing=id;

 showForm(x);

}

/* DELETE → RECYCLE BIN */

function deleteCustomer(id){

 let x=customers.find(c=>c.id===id);

 if(!x)return;

 if(!confirm("Customer को Recycle Bin में भेजना है?"))
  return;

 trash.push({
  ...x,
  deletedAt:new Date().toISOString()
 });

 customers=
 customers.filter(c=>c.id!==id);

 saveData();

 renderList();

}

/* RECYCLE BIN PIN */

function recycleBin(){

 let saved=localStorage.getItem(BINPIN);

 if(!saved){

  let p=prompt("Recycle Bin के लिए नया 6-digit PIN बनाएँ");

  if(!p||!/^\d{6}$/.test(p)){

   alert("6 digit PIN जरूरी है");
   return;

  }

  localStorage.setItem(BINPIN,btoa(p));

 }

 let p=prompt("Recycle Bin PIN डालें");

 if(btoa(p||"")!==localStorage.getItem(BINPIN)){

  alert("गलत Recycle Bin PIN");
  return;

 }

 showRecycle();

}

function showRecycle(){

 $("title").textContent="🗑️ Recycle Bin";

 let html=

 trash.length?

 trash.map(x=>`

 <div class="customer">

 <h3>${esc(x.name)}</h3>

 <div>
 ${esc(x.appliance)}
 →
 ${esc(x.work)}
 </div>

 <div class="muted">
 ₹${esc(x.payment||0)}
 <br>
 Deleted: ${new Date(x.deletedAt).toLocaleString()}
 </div>

 <div class="actions">

 <button class="success"
 onclick="restoreCustomer('${x.id}')">
 ♻️ Restore
 </button>

 <button class="danger"
 onclick="permanentDelete('${x.id}')">
 ❌ Permanently Delete
 </button>

 </div>

 </div>

 `).join("")

 :

 `<p class="muted">Recycle Bin खाली है।</p>`;

 $("form").innerHTML=
 html+
 `<button class="secondary" onclick="closeModal()">Close</button>`;

 $("modal").classList.remove("hidden");

}

function restoreCustomer(id){

 let x=trash.find(c=>c.id===id);

 if(!x)return;

 delete x.deletedAt;

 customers.push(x);

 trash=trash.filter(c=>c.id!==id);

 saveData();

 showRecycle();

}

function permanentDelete(id){

 if(!confirm("यह Customer हमेशा के लिए delete हो जाएगा।"))
  return;

 trash=trash.filter(c=>c.id!==id);

 saveData();

 showRecycle();

}

/* HISTORY */

function historyPage(){

 $("title").textContent="📋 Customer History";

 let html="";

 customers.forEach(x=>{

  if(!x.history||!x.history.length)return;

  html+=`

  <div class="customer">

  <h3>${esc(x.name)}</h3>

  ${x.history.map(h=>`

   <div class="panel">

   📅 ${esc(h.date)}<br>
   ${esc(h.appliance)}
   →
   <b>${esc(h.work)}</b><br>

   📝 ${esc(h.description||"")}<br>

   💰 ₹${esc(h.payment||0)}
   (${esc(h.method||"")})

   </div>

  `).join("")}

  </div>

  `;

 });

 if(!html)
  html="<p class='muted'>अभी History उपलब्ध नहीं है।</p>";

 $("form").innerHTML=
 html+
 `<button class="secondary" onclick="closeModal()">Close</button>`;

 $("modal").classList.remove("hidden");

}

/* BACKUP */

function backup(){

 let data={
  customers,
  trash,
  date:new Date().toISOString(),
  app:"JAGESH ELECTRONIC"
 };

 let blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 let a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download=
 "JAGESH-ELECTRONIC-BACKUP-"+today()+".json";

 a.click();

}

function restoreBackup(e){

 let file=e.target.files[0];

 if(!file)return;

 let reader=new FileReader();

 reader.onload=()=>{

  try{

   let data=JSON.parse(reader.result);

   if(!confirm("Backup restore करने पर current data replace होगा। Continue?"))
    return;

   customers=data.customers||[];
   trash=data.trash||[];

   saveData();

   alert("✅ Backup Restore हो गया");

  }catch(err){

   alert("Backup file सही नहीं है");

  }

 };

 reader.readAsText(file);

}

/* MODAL */

function closeModal(){

 $("modal").classList.add("hidden");

}

/* APP PIN */

function pinHash(p){

 return btoa("JAGESH-"+p);

}

function drawDots(){

 $("dots").innerHTML=

 Array.from({length:6},(_,i)=>
 `<span class="dot ${i<pin.length?"on":""}"></span>`
 ).join("");

}

function setupPin(){

 let saved=localStorage.getItem(PIN);

 pin="";

 if(saved){

  pinMode="login";
  $("pinText").textContent="अपना 6-digit App PIN डालें";

 }else{

  pinMode="setup";
  $("pinText").textContent="पहली बार 6-digit App PIN बनाएँ";

 }

 $("lock").classList.remove("hidden");

 drawDots();

}

for(let n=1;n<=9;n++){

 let b=document.createElement("button");

 b.className="key";

 b.textContent=n;

 b.onclick=()=>{

  if(pin.length<6){

   pin+=n;
   drawDots();

   if(pin.length===6)
    setTimeout(checkPin,100);

  }

 };

 $("pad").appendChild(b);

}

let zero=document.createElement("button");

zero.className="key";
zero.textContent="0";

zero.onclick=()=>{

 if(pin.length<6){

  pin+="0";
  drawDots();

  if(pin.length===6)
   setTimeout(checkPin,100);

 }

};

$("pad").appendChild(zero);

let back=document.createElement("button");

back.className="key";
back.textContent="⌫";

back.onclick=()=>{

 pin=pin.slice(0,-1);
 drawDots();

};

$("pad").appendChild(back);

function checkPin(){

 let hashed=pinHash(pin);

 if(pinMode==="setup"){
