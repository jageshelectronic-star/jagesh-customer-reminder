<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>JAGESH ELECTRONIC – Customer Reminder</title>
    <style>
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
        body{overflow-x:hidden}
        .app{max-width:900px;margin:auto;padding:10px}
        .card{background:#fff;border-radius:16px;padding:15px;margin:9px 0;box-shadow:0 2px 12px #0001}
        .logo{display:flex;align-items:center;gap:10px}
        .logo img{width:48px;height:48px;object-fit:contain;border-radius:9px}
        input,select,button{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font-size:16px;margin-top:8px}
        button{background:#0f172a;color:#fff;border:0;cursor:pointer}
        .secondary{background:#e2e8f0;color:#0f172a}
        .danger{background:#b91c1c;color:#fff}
        .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
        @media(max-width:600px){
            .grid{grid-template-columns:1fr}
            .app{padding:7px}
            .card{padding:12px}
        }
        .hidden{display:none!important}
        .muted{color:#64748b;font-size:14px}
        .error{color:#b91c1c;margin-top:8px;font-size:14px}
        .success{color:#15803d;margin-top:8px;font-size:14px}
        .otp{letter-spacing:8px;text-align:center;font-size:24px}
        .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
        .tabs button{margin:0;font-size:14px}
        .list{border:1px solid #e2e8f0;border-radius:10px;padding:11px;margin:8px 0;background:#fff}
        .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
        .small{width:auto;min-height:38px;padding:7px 12px;font-size:14px;margin:4px 2px 0 0}
    </style>
</head>
<body>
<div class="app">
    <!-- LOGIN SCREEN -->
    <div id="login" class="card">
        <div class="logo">
            <img src="logo.jpg" onerror="this.style.display='none'">
            <div>
                <h2>JAGESH ELECTRONIC</h2>
                <div class="muted">Customer Reminder</div>
            </div>
        </div>
        <div id="pinBox">
            <input id="pin" inputmode="numeric" maxlength="6" type="password" placeholder="6-digit PIN">
            <button onclick="loginPin()">Login</button>
            <button class="secondary" onclick="forgot()">PIN भूल गए?</button>
        </div>
        
        <!-- PIN RECOVERY (SUPABASE) -->
        <div id="forgotBox" class="hidden">
            <h3>PIN Recovery</h3>
            <div class="muted">Registered email पर 6-digit OTP भेजें।</div>
            <input id="email" type="email" autocomplete="email" placeholder="Email address">
            <button onclick="sendOtp()">Send OTP</button>
            
            <div id="otpArea" class="hidden">
                <input id="otp" class="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP">
                <button onclick="verifyOtp()">Verify OTP</button>
                <button id="resend" class="secondary" onclick="sendOtp()" disabled>Resend OTP (60)</button>
                <div id="otpMsg"></div>
            </div>
            
            <div id="newPin" class="hidden">
                <input id="np1" type="password" inputmode="numeric" maxlength="6" placeholder="नया 6-digit PIN">
                <input id="np2" type="password" inputmode="numeric" maxlength="6" placeholder="PIN दोबारा डालें">
                <button onclick="savePin()">नया PIN सेव करें</button>
            </div>
            <button class="secondary" onclick="backLogin()">← वापस Login</button>
        </div>
        <div id="loginMsg" class="error"></div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app" class="hidden">
        <div class="card">
            <div class="logo">
                <img src="logo.jpg" onerror="this.style.display='none'">
                <div>
                    <h2>JAGESH ELECTRONIC</h2>
                    <div class="muted">Customer Reminder Dashboard</div>
                </div>
            </div>
            <button class="small secondary" onclick="logout()">Logout</button>
        </div>
        
        <!-- NAVIGATION TABS -->
        <div class="tabs">
            <button onclick="tab('dash')">Dashboard</button>
            <button onclick="tab('add')">Add Customer</button>
            <button onclick="tab('bin')">Recycle Bin</button>
        </div>
        
        <!-- DASHBOARD TAB -->
        <section id="dash" class="card">
            <h3>Dashboard</h3>
            <div id="stats"></div>
            <div id="customers"></div>
        </section>
        
        <!-- ADD CUSTOMER TAB -->
        <section id="add" class="card hidden">
            <h3>Customer / Appliance</h3>
            <div class="grid">
                <input id="name" placeholder="Customer name">
                <input id="phone" inputmode="tel" placeholder="Mobile number">
                <select id="appliance" onchange="types()">
                    <option value="">Appliance चुनें</option>
                    <option>AC</option>
                    <option>LED TV</option>
                    <option>Refrigerator</option>
                    <option>Microwave</option>
                </select>
                <select id="work">
                    <option value="">Work Type चुनें</option>
                </select>
                <input id="date" type="date">
                <select id="rem">
                    <option value="">Reminder</option>
                    <option value="30">1 Month</option>
                    <option value="60">2 Months</option>
                    <option value="90">3 Months</option>
                    <option value="365">1 Year</option>
                    <option value="custom">Custom Date</option>
                </select>
                <input id="custom" class="hidden" type="date">
                <input id="amount" inputmode="decimal" placeholder="Amount">
                <select id="payment">
                    <option value="">Payment Method</option>
                    <option>Cash</option>
                    <option>UPI</option>
                    <option>Card</option>
                    <option>Bank Transfer</option>
                    <option>Pending</option>
                </select>
                <input id="loc" readonly placeholder="Current location">
            </div>
            <button onclick="gps()">📍 Current GPS Location</button>
            <button onclick="save()">Save Customer</button>
            <div id="saveMsg"></div>
        </section>
        
        <!-- RECYCLE BIN TAB -->
        <section id="bin" class="card hidden">
            <h3>🔐 Recycle Bin</h3>
            <div id="binList"></div>
        </section>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
const SUPABASE_URL="REPLACE_WITH_YOUR_SUPABASE_URL",SUPABASE_KEY="REPLACE_WITH_YOUR_PUBLISHABLE_KEY";
let sb=null;
try{if(!SUPABASE_URL.includes("REPLACE"))sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}

const DK="jagesh_v14_data",PK="jagesh_v14_pin",SK="jagesh_v14_session";
let d=JSON.parse(localStorage.getItem(DK)||'{"customers":[],"bin":[]}');
const $=id=>document.getElementById(id);

function saveData(){localStorage.setItem(DK,JSON.stringify(d))}
function initPin(){if(!localStorage.getItem(PK))localStorage.setItem(PK,"972103")}

function loginPin(){
    let p=$("pin").value;
    if(!/^\d{6}$/.test(p))return note("loginMsg","6-digit PIN डालें");
    initPin();
    if(p===localStorage.getItem(PK)){
        localStorage.setItem(SK,"1");
        open();
    }else note("loginMsg","Incorrect PIN");
}

function open(){
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    render();
}

function logout(){
    localStorage.removeItem(SK);
    location.reload();
}

function forgot(){
    $("pinBox").classList.add("hidden");
    $("forgotBox").classList.remove("hidden");
    $("loginMsg").textContent="";
}

function backLogin(){
    $("forgotBox").classList.add("hidden");
    $("pinBox").classList.remove("hidden");
}

async function sendOtp(){
    if(!sb)return note("otpMsg","Supabase URL/Publishable Key अभी सेट नहीं है।");
    let email=$("email").value.trim();
    if(!email)return note("otpMsg","Email डालें");
    let r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
    if(r.error)return note("otpMsg",r.error.message);
    $("otpArea").classList.remove("hidden");
    note("otpMsg","OTP email पर भेज दिया गया है।","success");
    timer();
}

async function verifyOtp(){
    if(!sb)return;
    let email=$("email").value.trim(),token=$("otp").value.trim();
    if(!/^\d{6}$/.test(token))return note("otpMsg","6-digit OTP डालें");
    let r=await sb.auth.verifyOtp({email,token,type:"email"});
    if(r.error)return note("otpMsg",r.error.message);
    $("newPin").classList.remove("hidden");
    note("otpMsg","OTP verified. नया PIN बनाएं।","success");
}

async function savePin(){
    let a=$("np1").value,b=$("np2").value;
    if(!/^\d{6}$/.test(a)||a!==b)return note("otpMsg","समान 6-digit PIN दोनों जगह डालें");
    localStorage.setItem(PK,a);
    if(sb)await sb.auth.signOut();
    note("otpMsg","नया PIN सेव हो गया। अब Login करें।","success");
    setTimeout(backLogin,800);
}

function timer(){
    let n=60,b=$("resend");
    b.disabled=true;
    b.textContent="Resend OTP ("+n+")";
    let t=setInterval(()=>{
        n--;
        b.textContent=n?"Resend OTP ("+n+")":"Resend OTP";
        if(!n){b.disabled=false;clearInterval(t)}
    },1000);
}

function note(id,t,k="error"){$(id).textContent=t;$(id).className=k}

function tab(x){
    ["dash","add","bin"].forEach(i=>$(i).classList.toggle("hidden",i!==x));
